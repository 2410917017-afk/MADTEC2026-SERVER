services:

  postgres:
    image: postgres:17
    container_name: cetevi_1
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cetevi_1"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - laboratorio_net

  fastapi:
    build:
      context: ../backend

    container_name: cetevi_api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - laboratorio_net

networks:
  laboratorio_net:
